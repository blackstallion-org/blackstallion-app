# J24: Wrong scan / missing passport
# Status: untested on device
appId: ${MAESTRO_APP_ID}
---
- launchApp

# Sign in as instructor
- tapOn:
    id: "email-input"
- inputText: ${INSTRUCTOR_EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${INSTRUCTOR_PASSWORD}
- tapOn:
    id: "sign-in-button"
- assertVisible:
    id: "field-today"
    timeout: 15000

# Navigate to scan with manual entry
- tapOn:
    id: "scan-button"
- tapOn:
    id: "scan-manual-entry"

# Enter invalid passport code
- tapOn:
    id: "passport-code-input"
- inputText: "INVALID-CODE-999"
- tapOn:
    id: "submit-scan"

# Assert error/rejection is shown
- assertVisible:
    id: "scan-error"
    timeout: 10000
